apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beacon
  namespace: beacon
  labels:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/part-of: beacon-lab
spec:
  ingressClassName: traefik
  rules:
    - host: beacon.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beacon
                port:
                  name: http
